<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixiJS 高级海草动态模拟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #001122 0%, #003344 100%);
            color: #e6f7ff;
            overflow: hidden;
            height: 100vh;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 20, 40, 0.8);
            padding: 20px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 205, 196, 0.3);
            max-width: 350px;
        }
        
        h1 {
            font-size: 1.6rem;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        
        p {
            font-size: 0.95rem;
            color: #a8d8ff;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .feature-list {
            margin-top: 15px;
            padding-left: 20px;
        }
        
        .feature-list li {
            color: #7ec8e3;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 20, 40, 0.8);
            padding: 20px 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-label {
            display: block;
            font-size: 0.85rem;
            color: #4ecdc4;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .control-slider {
            width: 220px;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            outline: none;
        }
        
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(78, 205, 196, 0.5);
        }
        
        .control-value {
            font-size: 0.9rem;
            color: #44a08d;
            font-weight: bold;
            display: inline-block;
            margin-left: 12px;
        }
        
        .stats {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 20, 40, 0.8);
            padding: 15px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #a8d8ff;
            margin-top: 5px;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #001122;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-bar {
            width: 400px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 30px;
        }
        
        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            width: 0%;
            transition: width 0.4s ease;
        }
        
        @media (max-width: 768px) {
            #info, .controls, .stats {
                padding: 12px;
                max-width: calc(100vw - 40px);
            }
            
            .control-slider {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div id="container"></div>
    
    <div id="info">
        <h1>PixiJS 高级海草模拟</h1>
        <p>基于 PixiJS MeshRope 的真实物理模拟</p>
        <p>支持 GPU 加速渲染，性能卓越</p>
        
        <ul class="feature-list">
            <li>MeshRope 绳索动力学</li>
            <li>自定义 GLSL 着色器</li>
            <li>水下尘埃粒子滤镜</li>
            <li>实时物理参数调节</li>
        </ul>
    </div>
    
    <div class="controls">
        <div class="control-group">
            <label class="control-label">水流强度: <span id="currentValue" class="control-value">0.5</span></label>
            <input type="range" class="control-slider" id="currentStrength" min="0" max="1" value="0.5" step="0.1">
        </div>
        
        <div class="control-group">
            <label class="control-label">摆动频率: <span id="swayValue" class="control-value">1.0</span></label>
            <input type="range" class="control-slider" id="swayFrequency" min="0.1" max="2" value="1.0" step="0.1">
        </div>
        
        <div class="control-group">
            <label class="control-label">柔软度: <span id="flexValue" class="control-value">0.7</span></label>
            <input type="range" class="control-slider" id="flexibility" min="0.1" max="1" value="0.7" step="0.1">
        </div>
        
        <div class="control-group">
            <label class="control-label">粒子效果: <span id="particleValue" class="control-value">0.5</span></label>
            <input type="range" class="control-slider" id="particleEffect" min="0" max="1" value="0.5" step="0.1">
        </div>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <div class="stat-value" id="fps">0</div>
            <div class="stat-label">FPS</div>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <h1>正在初始化 PixiJS 海草场景...</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.2.6/dist/pixi.min.mjs"
            }
        }
    </script>
    
    <script type="module">
        import * as PIXI from 'pixi.js';
        
        // ========================================
        // 自定义尘埃粒子滤镜
        // ========================================
        class UnderwaterDustFilter extends PIXI.Filter {
            constructor(options = {}) {
                const {
                    count = 80,
                    speed = 0.5,
                    size = 0.006,
                    alpha = 0.4,
                    color = 0xaaddff
                } = options;
                
                const vertexShader = `
                    in vec2 aPosition;
                    out vec2 vTextureCoord;
                    
                    uniform vec4 uInputSize;
                    uniform vec4 uOutputFrame;
                    uniform vec4 uOutputTexture;
                    
                    vec4 filterVertexPosition(void) {
                        vec2 position = aPosition * uOutputFrame.zw + uOutputFrame.xy;
                        position.x = position.x * (2.0 / uOutputTexture.x) - 1.0;
                        position.y = position.y * (2.0 * uOutputTexture.z / uOutputTexture.y) - uOutputTexture.z;
                        return vec4(position, 0.0, 1.0);
                    }
                    
                    vec2 filterTextureCoord(void) {
                        return aPosition * (uOutputFrame.zw * uInputSize.zw);
                    }
                    
                    void main(void) {
                        gl_Position = filterVertexPosition();
                        vTextureCoord = filterTextureCoord();
                    }
                `;
                
                const fragmentShader = `
                    in vec2 vTextureCoord;
                    out vec4 finalColor;
                    
                    uniform sampler2D uTexture;
                    uniform vec4 uInputSize;
                    uniform vec3 uColor;
                    uniform float uTime;
                    uniform float uCount;
                    uniform float uSpeed;
                    uniform float uSize;
                    uniform float uAlpha;
                    
                    float hash(vec2 p) {
                        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
                    }
                    
                    void main() {
                        vec4 original = texture(uTexture, vTextureCoord);
                        float dustAccum = 0.0;
                        float aspect = uInputSize.x / uInputSize.y;
                        
                        for (int i = 0; i < 150; i++) {
                            if (float(i) >= uCount) break;
                            float id = float(i) + 0.5;
                            float rx = hash(vec2(id, 0.0));
                            float ry = hash(vec2(id, 1.0));
                            float rs = hash(vec2(id, 2.0));
                            float rsp = hash(vec2(id, 3.0));
                            float rph = hash(vec2(id, 4.0));
                            float rbr = hash(vec2(id, 5.0));
                            
                            float t = uTime * uSpeed * (0.3 + rsp * 0.7);
                            
                            float px = fract(rx + sin(t * 0.7 + rph * 6.283) * 0.1 + cos(t * 0.3 + rph * 3.0) * 0.05);
                            float py = fract(ry + cos(t * 0.5 + rph * 4.0) * 0.08 - t * 0.02);
                            
                            vec2 diff = vTextureCoord - vec2(px, py);
                            diff.x *= aspect;
                            float dist = length(diff);
                            
                            float moteSize = uSize * (0.4 + rs * 0.6);
                            float mote = smoothstep(moteSize, moteSize * 0.1, dist);
                            
                            float twinkle = 0.5 + 0.5 * sin(t * 2.5 + rph * 6.283);
                            
                            dustAccum += mote * (0.4 + rbr * 0.6) * twinkle;
                        }
                        
                        dustAccum *= uAlpha;
                        vec3 color = original.rgb + uColor * dustAccum * original.a;
                        finalColor = vec4(color, original.a);
                    }
                `;
                
                super({
                    glProgram: new PIXI.GlProgram({
                        vertex: vertexShader,
                        fragment: fragmentShader
                    }),
                    resources: {
                        underwaterDustUniforms: {
                            uColor: { value: new Float32Array(3), type: 'vec3<f32>' },
                            uTime: { value: 0, type: 'f32' },
                            uCount: { value: count, type: 'f32' },
                            uSpeed: { value: speed, type: 'f32' },
                            uSize: { value: size, type: 'f32' },
                            uAlpha: { value: alpha, type: 'f32' }
                        }
                    }
                });
                
                this._color = color;
                this._startTime = performance.now();
                this.color = color;
            }
            
            apply(filterManager, input, output, clearMode) {
                this.resources.underwaterDustUniforms.uniforms.uTime = (performance.now() - this._startTime) / 1000;
                filterManager.applyFilter(this, input, output, clearMode);
            }
            
            get color() {
                return this._color;
            }
            set color(value) {
                this._color = value;
                const u = this.resources.underwaterDustUniforms.uniforms;
                u.uColor[0] = ((value >> 16) & 0xff) / 255;
                u.uColor[1] = ((value >> 8) & 0xff) / 255;
                u.uColor[2] = (value & 0xff) / 255;
            }
            
            get alpha() {
                return this.resources.underwaterDustUniforms.uniforms.uAlpha;
            }
            set alpha(value) {
                this.resources.underwaterDustUniforms.uniforms.uAlpha = value;
            }
        }
        
        // ========================================
        // 海草类
        // ========================================
        class Seaweed {
            constructor(app, x, y, options = {}) {
                this.app = app;
                this.x = x;
                this.baseY = y;
                this.height = options.height || 200 + Math.random() * 100;
                this.width = options.width || 15 + Math.random() * 10;
                this.pointCount = options.pointCount || 15;
                this.points = [];
                this.swayOffset = Math.random() * Math.PI * 2;
                this.baseRotation = Math.random() * Math.PI * 2;
                
                // 物理参数
                this.params = {
                    currentStrength: 0.5,
                    swayFrequency: 1.0,
                    flexibility: 0.7
                };
                
                this.textureLoaded = false;
                
                this.initPoints();
                this.createMeshRope();
                
                // 异步加载外部纹理
                this.loadTexture();
            }
            
            initPoints() {
                // 创建绳索点
                for (let i = 0; i < this.pointCount; i++) {
                    const t = i / (this.pointCount - 1);
                    this.points.push(new PIXI.Point(0, t * this.height));
                }
            }
            
            async loadTexture() {
                try {
                    // 优先尝试使用 Base64 嵌入纹理（避免 CORS 问题）
                    const base64Texture = await this.getBase64Texture();
                    if (base64Texture) {
                        this.texture = PIXI.Texture.from(base64Texture);
                        console.log('✓ 海草纹理（Base64）加载成功！');
                        if (this.rope) {
                            this.rope.texture = this.texture;
                        }
                        this.textureLoaded = true;
                        return;
                    }
                    
                    // 如果没有 Base64，尝试加载外部文件
                    this.texture = await PIXI.Assets.load('./seaweed.png');
                    console.log('✓ 海草纹理加载成功！');
                    
                    // 更新所有使用该纹理的海草
                    if (this.rope) {
                        this.rope.texture = this.texture;
                    }
                    this.textureLoaded = true;
                } catch (error) {
                    console.warn('⚠ 海草纹理加载失败，使用程序化纹理:', error);
                    // 加载失败，使用程序化纹理作为备用
                    this.texture = this.createProceduralTexture();
                    if (this.rope) {
                        this.rope.texture = this.texture;
                    }
                }
            }
            
            async getBase64Texture() {
                // ========================================
                // 从外部文件读取 Base64 纹理
                // ========================================
                try {
                    const response = await fetch('./seaweed-base64-code.txt');
                    const text = await response.text();
                    
                    // 文件内容格式: return 'data:image/png;base64,...'
                    // 提取 return 语句后的字符串
                    const match = text.match(/return\s+['"](data:[^'"]+)['"]/);
                    if (match && match[1]) {
                        console.log('✓ 从外部文件加载 Base64 纹理成功！');
                        return match[1];
                    }
                } catch (error) {
                    console.warn('⚠ 读取 Base64 文件失败:', error);
                }
                
                return null; // 返回 null 表示不使用 Base64
            }
            
            
            createProceduralTexture() {
                // 创建程序化海草纹理作为备用
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                
                // 渐变背景
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#8ade78');      // 顶部亮绿色
                gradient.addColorStop(0.3, '#5dd879');   // 中上部绿色
                gradient.addColorStop(0.6, '#2eb85c');   // 中部绿色
                gradient.addColorStop(1, '#1a8a42');     // 底部深绿色
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 添加叶脉
                ctx.strokeStyle = 'rgba(0, 80, 40, 0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 2, 0);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                
                // 添加斑点纹理
                for (let i = 0; i < 30; i++) {
                    ctx.fillStyle = `rgba(0, 60, 30, ${0.05 + Math.random() * 0.08})`;
                    ctx.beginPath();
                    ctx.ellipse(
                        canvas.width / 2 + (Math.random() - 0.5) * 40,
                        Math.random() * canvas.height,
                        3 + Math.random() * 8,
                        20 + Math.random() * 40,
                        0, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
                
                return PIXI.Texture.from(canvas);
            }
            
            createMeshRope() {
                // 初始使用程序化纹理，加载完成后会替换
                this.texture = this.createProceduralTexture();
                
                // 创建 MeshRope
                this.rope = new PIXI.MeshRope({
                    texture: this.texture,
                    points: this.points
                });
                
                this.rope.x = this.x;
                this.rope.y = this.baseY;
                this.rope.rotation = this.baseRotation;
                
                // 设置混合模式
                this.rope.alpha = 0.9;
            }
            
            update(time) {
                const t = time + this.swayOffset;
                const {
                    currentStrength,
                    swayFrequency,
                    flexibility
                } = this.params;
                
                // 更新每个点的位置，模拟海草摆动
                for (let i = 1; i < this.points.length; i++) {
                    const point = this.points[i];
                    const baseY = (i / (this.points.length - 1)) * this.height;
                    
                    // 基础摆动
                    const sway = Math.sin(t * swayFrequency + i * 0.5) * currentStrength * flexibility * 30;
                    
                    // 湍流效果
                    const turbulence = Math.sin(t * 1.5 + i * 0.3) * 5 + 
                                     Math.cos(t * 2.0 + i * 0.4) * 3;
                    
                    // 高度因子 - 越高摆动越大
                    const heightFactor = i / (this.points.length - 1);
                    
                    // 设置新位置
                    point.x = sway * heightFactor + turbulence * heightFactor;
                    point.y = baseY + Math.sin(heightFactor * Math.PI) * 10;
                }
            }
            
            setParams(params) {
                Object.assign(this.params, params);
            }
        }
        
        // ========================================
        // 气泡类
        // ========================================
        class Bubble {
            constructor(app) {
                this.app = app;
                this.graphics = new PIXI.Graphics();
                this.reset();
                
                // 随机速度
                this.speedY = 0.5 + Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.size = 3 + Math.random() * 8;
            }
            
            reset() {
                this.graphics.x = Math.random() * window.innerWidth;
                this.graphics.y = window.innerHeight + Math.random() * 100;
                this.speedY = 0.5 + Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.size = 3 + Math.random() * 8;
            }
            
            update() {
                this.graphics.y -= this.speedY;
                this.graphics.x += Math.sin(this.graphics.y * 0.02) * 0.3;
                
                // 重置位置
                if (this.graphics.y < -20) {
                    this.reset();
                }
                
                // 绘制气泡
                this.graphics.clear();
                this.graphics.circle(0, 0, this.size);
                this.graphics.stroke({ width: 1.5, color: 0x88ccff, alpha: 0.6 });
                this.graphics.fill({ color: 0xaaddff, alpha: 0.2 });
            }
        }
        
        // ========================================
        // 主场景类
        // ========================================
        class UnderwaterScene {
            constructor() {
                this.params = {
                    currentStrength: 0.5,
                    swayFrequency: 1.0,
                    flexibility: 0.7,
                    particleEffect: 0.5
                };
                
                this.init();
            }
            
            async init() {
                // 创建 PixiJS 应用
                this.app = new PIXI.Application();
                
                await this.app.init({
                    resizeTo: window,
                    backgroundColor: 0x001122,
                    antialias: true,
                    resolution: window.devicePixelRatio || 1,
                    autoDensity: true
                });
                
                document.getElementById('container').appendChild(this.app.canvas);
                
                // 创建海床
                this.createSeaBed();
                
                // 创建海草
                this.createSeaweeds();
                
                // 创建气泡
                this.createBubbles();
                
                // 添加尘埃滤镜
                this.addDustFilter();
                
                // 绑定事件
                this.bindEvents();
                
                // 开始动画
                this.animate();
                
                // 隐藏加载界面
                setTimeout(() => {
                    this.hideLoading();
                }, 1000);
            }
            
            createSeaBed() {
                const seaBed = new PIXI.Graphics();
                
                // 绘制海床
                seaBed.rect(0, window.innerHeight - 50, window.innerWidth, 100);
                seaBed.fill({ color: 0x1a4a3c, alpha: 1 });
                
                // 添加一些海底纹理
                for (let i = 0; i < 50; i++) {
                    seaBed.circle(
                        Math.random() * window.innerWidth,
                        window.innerHeight - 40 + Math.random() * 30,
                        5 + Math.random() * 15
                    );
                    seaBed.fill({ color: 0x145a32, alpha: 0.5 });
                }
                
                this.app.stage.addChild(seaBed);
            }
            
            createSeaweeds() {
                this.seaweeds = [];
                
                // 创建多个海草
                const seaweedCount = 40;
                
                for (let i = 0; i < seaweedCount; i++) {
                    const x = Math.random() * window.innerWidth;
                    const y = window.innerHeight - 50;
                    
                    const seaweed = new Seaweed(this.app, x, y, {
                        height: 150 + Math.random() * 200,
                        width: 12 + Math.random() * 15,
                        pointCount: 18
                    });
                    
                    seaweed.setParams(this.params);
                    this.seaweeds.push(seaweed);
                    this.app.stage.addChild(seaweed.rope);
                }
            }
            
            createBubbles() {
                this.bubbles = [];
                const bubbleCount = 35;
                
                for (let i = 0; i < bubbleCount; i++) {
                    const bubble = new Bubble(this.app);
                    bubble.graphics.y = Math.random() * window.innerHeight;
                    this.bubbles.push(bubble);
                    this.app.stage.addChild(bubble.graphics);
                }
            }
            
            addDustFilter() {
                // 创建尘埃滤镜
                this.dustFilter = new UnderwaterDustFilter({
                    count: 100,
                    speed: 0.4,
                    size: 0.005,
                    alpha: 0.3 * this.params.particleEffect,
                    color: 0xaaddff
                });
                
                // 应用滤镜
                this.app.stage.filters = [this.dustFilter];
            }
            
            bindEvents() {
                // 窗口大小变化
                window.addEventListener('resize', () => this.onWindowResize());
                
                // 控制滑块
                document.getElementById('currentStrength').addEventListener('input', (e) => {
                    this.params.currentStrength = parseFloat(e.target.value);
                    document.getElementById('currentValue').textContent = e.target.value;
                    this.updateSeaweedParams();
                });
                
                document.getElementById('swayFrequency').addEventListener('input', (e) => {
                    this.params.swayFrequency = parseFloat(e.target.value);
                    document.getElementById('swayValue').textContent = e.target.value;
                    this.updateSeaweedParams();
                });
                
                document.getElementById('flexibility').addEventListener('input', (e) => {
                    this.params.flexibility = parseFloat(e.target.value);
                    document.getElementById('flexValue').textContent = e.target.value;
                    this.updateSeaweedParams();
                });
                
                document.getElementById('particleEffect').addEventListener('input', (e) => {
                    this.params.particleEffect = parseFloat(e.target.value);
                    document.getElementById('particleValue').textContent = e.target.value;
                    this.updateDustFilter();
                });
            }
            
            updateSeaweedParams() {
                this.seaweeds.forEach(seaweed => {
                    seaweed.setParams(this.params);
                });
            }
            
            updateDustFilter() {
                if (this.dustFilter) {
                    this.dustFilter.alpha = 0.3 * this.params.particleEffect;
                }
            }
            
            onWindowResize() {
                // PixiJS 会自动处理 resize
            }
            
            animate() {
                const time = performance.now() * 0.001;
                
                // 更新 FPS
                this.updateFPS();
                
                // 更新海草
                this.seaweeds.forEach(seaweed => {
                    seaweed.update(time);
                });
                
                // 更新气泡
                this.bubbles.forEach(bubble => {
                    bubble.update();
                });
                
                // 继续动画循环
                requestAnimationFrame(() => this.animate());
            }
            
            updateFPS() {
                if (!this.lastFrameTime) {
                    this.lastFrameTime = performance.now();
                    this.frameCount = 0;
                    return;
                }
                
                this.frameCount++;
                const now = performance.now();
                const elapsed = now - this.lastFrameTime;
                
                if (elapsed >= 1000) {
                    const fps = Math.round((this.frameCount * 1000) / elapsed);
                    document.getElementById('fps').textContent = fps;
                    this.frameCount = 0;
                    this.lastFrameTime = now;
                }
            }
            
            hideLoading() {
                const loading = document.getElementById('loading');
                loading.style.opacity = '0';
                loading.style.pointerEvents = 'none';
                setTimeout(() => {
                    loading.style.display = 'none';
                }, 500);
            }
        }
        
        // 初始化场景
        window.addEventListener('DOMContentLoaded', () => {
            new UnderwaterScene();
        });
    </script>
</body>
</html>
